node: flo/ai.classify@1
kind: builtin
description: One label per item from a closed set, with confidence and a reason.
inputs:
  items: { type: array, required: true, description: What to classify; each element a map. }
  labels: { type: array, required: true, items: { type: string }, description: The closed label set. }
  model: { type: string, required: true, description: "Model URI, e.g. anthropic://claude-haiku-5-5; ignored by the rules backend." }
  instructions: { type: string, description: Extra guidance. }
  pattern: { type: string, description: Named prompt pattern (judge backend; needs a pattern source). }
  strategy: { type: string, description: "Multi-call strategy: verbalized (default), votes or votes:<n> (judge backend)." }
  engine: { type: string, enum: [local, jev, auto], description: "Judge engine (judge backend): local (the step's model), jev (TypeSafe Jev through OpenRouter; cloud, ignores model) or auto (local when the model is a local ollama model the daemon lists, else jev). Default: the ai.judge.engine setting, else auto." }
  schema: { type: object, description: Extra fields per item the model must return; the judge backend refuses it. }
  abstain: { type: boolean, default: false, description: Allow no label. }
outputs:
  schema:
    type: object
    required: [items]
    properties:
      engine: { type: string, description: "The judge engine that answered (judge backend only)." }
      items:
        type: array
        items:
          type: object
          required: [item, label]
          properties:
            item: {}
            label: { type: [string, 'null'] }
            confidence: { type: number }
            why: { type: string }
capabilities: []
side_effect: none
privacy: cloud
cost: { class: low }

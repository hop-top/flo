node: flo/ai.generate@1
kind: builtin
description: Text from a versioned prompt and a context.
inputs:
  prompt: { type: string, required: true, description: "Prompt reference name@N: prompts/name@N.yaml in the flow bundle or an installed pack." }
  context: { type: object, description: Variables of the prompt template. }
  model: { type: [string, array], items: { type: string }, required: true, description: "Model URI, e.g. ollama://gemma4:e4b, or an ordered list of them (the first usable one answers). Every model must be on ai.models.allow. Ignored by the template backend." }
  schema: { type: object, description: Optional output schema for data. }
outputs:
  schema:
    type: object
    required: [text, prompt]
    properties:
      text: { type: string }
      data: { type: object }
      model: { type: string, description: "The model that answered, as a URI without secrets (llm backend only)." }
      prompt:
        type: object
        required: [name, version, hash]
        properties:
          name: { type: string }
          version: { type: integer }
          hash: { type: string }
capabilities: []
side_effect: none
privacy: cloud
cost: { class: low }

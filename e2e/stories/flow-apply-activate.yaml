schema_version: "1"
story_id: flo.flow.apply-activate
title: Store a flow as a version, test it and activate it
binary: flo
intent: |
  An operator has a flow bundle and wants it to run on its triggers.
  They validate it, store it as a version, record a test of that
  version, make it the active one and read when its triggers fire next.
steps:
  - id: validate
    intent: |
      Check the flow against the node specs and grants before storing it.
    invoke: ["flo", "flow", "validate", "-f", "flows/dependency-watch", "--format", "json"]
    capture: [exit_code, stdout]
  - id: apply
    intent: |
      Store the flow. Applying the same content again changes nothing.
    invoke: ["flo", "flow", "apply", "-f", "flows/dependency-watch", "--yes", "--format", "json"]
    capture: [exit_code, stdout]
  - id: record
    intent: |
      Run the flow once with real reads, keep them as cassettes and the
      skipped writes as plans; the result binds to this exact version.
    invoke: ["flo", "flow", "test", "dependency-watch", "--record", "--yes", "--allow-live", "--format", "json"]
    capture: [exit_code, stdout]
  - id: replay
    intent: |
      Test the version again on the recordings alone, offline.
    invoke: ["flo", "flow", "test", "dependency-watch", "--replay", "--format", "json"]
    capture: [exit_code, stdout]
  - id: activate
    intent: |
      Make the tested version the one new runs and triggers use.
    invoke: ["flo", "flow", "set", "dependency-watch", "--state", "active", "--yes", "--format", "json"]
    capture: [exit_code, stdout]
  - id: triggers
    intent: |
      Read the next fire of each trigger of the active flow.
    invoke: ["flo", "trigger", "list", "--format", "json"]
    capture: [exit_code, stdout]

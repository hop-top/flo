name: 12fcc

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    name: 12-factor AI-CLI conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write     # sticky PR comment
      security-events: write   # SARIF upload to code-scanning
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # No release tag yet: main, locked to a commit in actions.lock.
      - uses: hop-top/spec-12fc@main
        with:
          command: all
          paths: .
          diff: ""             # scan paths; --diff and --paths are exclusive
          upload-sarif: true
          pr-comment: ${{ github.event_name == 'pull_request' }}
          commit-badge: false

node: bos/workflow.status@1
kind: command
lowers_to: engine               # reshapes the row bos prints
description: The stage of a subject, read from its bos workflow instance (state, state version, quorum per transition).
argv:
  - bos
  - workflow
  - status
  - "{{ in.instance }}"
  - --scope
  - "{{ config.bos.scope }}"
  - --format
  - json
inputs:
  instance: { type: string, required: true, description: "The bos workflow instance id." }
exit_codes: { ok: [0] }
outputs:
  from: stdout
  format: json
  # bos prints the bos.flo/v1 stage as one document; the step's output is the
  # state, the state version a later request passes back (flags.state-version
  # of bos/workflow.request-transition@1) and the quorum of each transition.
  map: >-
    {{ {'instance_id': out.instance_id,
        'state': out.state,
        'state_version': out.state_version,
        'subject_id': out.subject_id,
        'subject_revision': out.subject_revision,
        'transitions': out.transitions} }}
  schema:
    type: object
    required: [instance_id, state, state_version, transitions]
    properties:
      instance_id: { type: string }
      state: { type: string }
      state_version: { type: integer }
      subject_id: { type: string }
      subject_revision: { type: integer }
      transitions:
        type: array
        items:
          type: object
          required: [action, to, status]
          properties:
            action: { type: string }
            to: { type: string }
            required: { type: integer }
            accepted: { type: integer }
            rejected: { type: integer }
            status: { type: string }
side_effect: read
privacy: local
idempotent: true
capabilities: [workflow.status]
timeout: 30s

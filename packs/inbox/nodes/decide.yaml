node: inbox/decide@1
kind: command
lowers_to: engine
description: Typed decisions for the run's messages, from headers only.
argv: [inbox, decide, "{{ in.run }}", --json]
inputs:
  run: { type: string, required: true }
exit_codes: { ok: [0] }
outputs:
  from: stdout
  format: json
  schema:
    type: object
    required: [run]
    properties:
      run: { type: string }
      engine: { type: [string, 'null'] }
      already_decided: { type: boolean }
      rows: { type: integer }
      asked: { type: integer }
      attention: { type: integer }
      needs_review: { type: integer }
      cost: { type: number }      # US dollars
side_effect: write-local        # writes the run's decisions; the model call spends money
idempotent: true                # an existing decisions file is kept, not asked again
privacy: cloud                  # headers go to a hosted classifier
capabilities: [mail.read]
timeout: 300s
cost: { class: metered, estimate: { usd: 0.05 } }

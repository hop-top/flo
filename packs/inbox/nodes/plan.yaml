node: inbox/plan@1
kind: command
lowers_to: engine               # reshapes its output with `map`
description: >-
  Split the decisions into automatic, pending and invalid. Marks the run's
  messages as seen and locks pending ones. Creates no task.
# inbox-plan (wrappers/) runs `inbox plan RUN --unattended --no-task --json`
# and adds the live items of plan.json to its summary: the summary alone has
# item numbers, not what each item would do. Exit 3 means some item is
# invalid; the invalid ones are listed in the output.
# `facts` (outputs of heo/plan-facts@1, one per heo account) go to the wrapper
# on stdin and the script plans those accounts from them with no mailbox I/O
# (`inbox plan --facts -`); an account listed with no facts is invalid, never
# automatic. No facts is no stdin: the plan as before.
argv: [inbox-plan, --out, "{{ run.step_dir }}/out.json", "{{ in.run }}"]
stdin:
  text: "{{ in.facts.filter(f, has(f.facts_json) && f.facts_json != '').map(f, f.facts_json).join('\\n') }}"
inputs:
  run: { type: string, required: true }
  facts: { type: array, items: { type: object }, default: [], description: "Outputs of heo/plan-facts@1, one per heo account." }
exit_codes: { ok: [0, 3] }
outputs:
  from: file:out.json
  format: json
  # An approval item: its id is the message id, stable across runs (the item
  # number is only unique within one). A decision held back by a guard (a rule
  # that always asks, a reply with extra recipients) has no trust class, so
  # trust can never approve it. Each item names the operation a person approves
  # (`capability`, `args`: the account, item number and actions), so the engine
  # keeps it as a proposal with a request digest; a reply or send is mail.send,
  # everything else mail.write.
  map: >-
    {{ {'run': out.run, 'run_dir': out.run_dir, 'counts': out.counts,
        'invalid': out.items.filter(i, i.status == 'invalid'),
        'auto': out.items.filter(i, i.status == 'auto' && i.executed == null).map(i,
          {'id': i.message_id, 'n': i.n, 'action': i.keys.join(', '), 'why': i.why,
           'class': i.keys, 'from': i.from, 'subject': i.subject, 'actions': i.actions,
           'capability': i.keys.exists(k, k.startsWith('reply') || k.startsWith('send')) ? 'mail.send' : 'mail.write',
           'args': {'account': i.account, 'n': i.n, 'actions': i.actions}}),
        'pending': out.items.filter(i, i.status == 'pending' && i.verdict == null).map(i,
          {'id': i.message_id, 'n': i.n, 'action': i.keys.join(', '), 'why': i.why,
           'class': i.guard == null ? i.keys : [], 'from': i.from, 'subject': i.subject,
           'actions': i.actions, 'guard': i.guard,
           'capability': i.keys.exists(k, k.startsWith('reply') || k.startsWith('send')) ? 'mail.send' : 'mail.write',
           'args': {'account': i.account, 'n': i.n, 'actions': i.actions}})} }}
  schema:
    type: object
    required: [run, run_dir, auto, invalid, pending]
    properties:
      run: { type: string }
      run_dir: { type: string }
      counts: { type: object }
      invalid: { type: array, items: { type: object } }
      auto:
        type: array
        items:
          type: object
          required: [id, n, action, why, class]
          properties:
            id: { type: string }
            n: { type: integer }
            action: { type: string }
            why: { type: string }
            class: { type: array, items: { type: string } }
      pending:
        type: array
        items:
          type: object
          required: [id, n, action, why, class]
          properties:
            id: { type: string }
            n: { type: integer }
            action: { type: string }
            why: { type: string }
            class: { type: array, items: { type: string } }
side_effect: write-local        # run files, seen set, locks; reads mail servers
idempotent: true                # re-planning keeps decided items and rebuilds locks
privacy: local
capabilities: [mail.read]
timeout: 60s

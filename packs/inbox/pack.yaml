pack: inbox
version: 0.2.0
description: "Mail triage through the inbox script: fetch, rows, decisions, plan, apply, and the trust it keeps."
requires: { flo: ">=0.1" }
# The nodes run `inbox` (and the wrappers in wrappers/) as
# `aps run <profile> -- <argv>`: put `inbox` and that directory on the PATH of
# the profile, and give the profile the script's credentials and its home and
# run directories (INBOX_HOME, INBOX_RUNS). The trust provider runs on the
# engine's own PATH and environment, which must name the same directories.
# The wrappers need jq. inbox/rows@1 and inbox/decisions@1 only read and write
# a run's files and ask no model; inbox/senders@1 asks the script for sender
# facts from its local store (headers, no network, no model): the judgment between them is a step of the
# flow (flo/ai.classify@1), local only. inbox/ingest@1 (wrappers/inbox-ingest)
# is the flow's fetch: it takes the listings of heo/inbox.list@1 (pack heo,
# installed beside this one) and fetches the other accounts itself. The script's hosted (cloud) decider is
# deliberately not a node: mail headers stay on the host.
nodes:
  - nodes/fetch.yaml
  - nodes/ingest.yaml
  - nodes/rows.yaml
  - nodes/senders.yaml
  - nodes/authfacts.yaml
  - nodes/lanes.yaml
  - nodes/decisions.yaml
  - nodes/plan.yaml
  - nodes/apply.yaml
trusts: [trusts/inbox.yaml]

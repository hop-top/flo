pack: heo
version: 0.5.0
description: Conversations from heo, selected by participant, an account's inbox as envelopes, the raw auth headers and plan facts the inbox script is handed, and the mailbox writes of the triage flow (low-blast, and the guarded high-blast ones).
requires: { flo: ">=0.1" }
# The node runs wrappers/heo-conversations as `aps run <profile> -- ...`: put
# that directory, heo and jq on the PATH of the profile, and run heo's daemon
# for it (without one heo exits 70 and the node retries). heo has no
# participant filter yet; the wrapper is the stand-in. Drop it, and point the
# node at `heo conversation list --participant`, when heo ships the flag.
# heo/message.raw@1 (wrappers/heo-message-raw) and heo/plan-facts@1
# (wrappers/heo-plan-facts) are read only the same way.
# heo/inbox.list@1 runs wrappers/heo-inbox-list the same way, under a read-only
# heo profile (see the node).
# heo/conversation.act@1 (wrappers/heo-conversation-act) and
# heo/provider-label.ensure@1 (wrappers/heo-label-ensure) are the only nodes
# that write, and they run under a different, write-scoped heo profile (desk
# role, the provider's modify grant, held operations off for it): never the
# read-only one above. Both need heo-write-lib on the PATH beside them.
# heo/conversation.act-high@1 (wrappers/heo-conversation-act --high, with
# heo-message-move beside it) is the third: trash, spam, unsubscribe, reply
# and a move to another account, only for items the script cleared.
nodes:
  - nodes/conversation-list.yaml
  - nodes/inbox-list.yaml
  - nodes/message-raw.yaml
  - nodes/plan-facts.yaml
  - nodes/conversation-act.yaml
  - nodes/conversation-act-high.yaml
  - nodes/label-ensure.yaml

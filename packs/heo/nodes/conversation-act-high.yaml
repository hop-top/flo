node: heo/conversation.act-high@1
kind: command
lowers_to: engine               # needs stdin
description: >-
  The high-blast mailbox operations the inbox script asked for one message
  (trash, spam, unsubscribe, reply draft or send, a move to another account,
  and the low-blast ops that go with them), run through heo on that message
  only, in order, each waited for until heo settles it.
# heo-conversation-act --high (wrappers/) is the one place a destructive or
# outgoing write reaches heo from the triage flow. Its guard is in two places:
# the flow runs this node only for an item the script marked `guard: cleared`
# whenever the item deletes (trash, spam, move_to), and this wrapper refuses
# (exit 64, before any call) a trash, spam or move_to on input that is not
# `guard: cleared`. Every write is `--message <provider_id>`: the message's own
# heo id, never the whole conversation.
#   trash, spam     conversation trash / move --role junk
#   unsubscribe     conversation unsubscribe, heo's policy (same-organization
#                   mailto, DKIM one-click, never a GET); the outcome is
#                   informational: `note` says what heo did, the item does not
#                   fail and the ops after it run
#   reply           message reply-draft (a draft) or message reply (send) with
#                   the script's text; only when this message is the latest
#                   inbound of its conversation, which is what heo answers
#   move_to         heo-message-move: forward from the source account, find
#                   the copy in the destination by its own Message-ID, file it
#                   there, trash the source last. A copy that has not arrived
#                   leaves the item held (status held, the source untouched)
# Run it under the same write-scoped heo profile as heo/conversation.act@1.
# An op that fails is data (exit 3: the ops after it are skipped). An outcome
# unknown (heo exit 8, or an operation that does not settle in
# FLO_HEO_SETTLE_TIMEOUT seconds, default 120) fails the step for good: the
# operation id is in the output and on stderr, and a person reconciles it
# (`heo delivery reconcile`). Nothing is retried, a send never repeats: the
# keys replay.
argv: [heo-conversation-act, --high, --out, "{{ run.step_dir }}/out.json"]
stdin:
  json: >-
    {{ {'n': in.n, 'account': in.account, 'channel': in.channel, 'provider_id': in.provider_id, 'guard': in.guard,
        'destinations': in.destinations, 'ops': in.ops} }}
inputs:
  n:            { type: integer, default: 0, description: "The plan item number, passed through to the output." }
  account:      { type: string, required: true, description: "The script's account name." }
  channel:      { type: string, default: "", description: "heo channel key; empty is the account name." }
  provider_id:  { type: string, required: true, description: "heo's id of the message (the store's provider id): every write targets this message alone." }
  guard:        { type: string, default: "", description: "`cleared` when the script's customer-vendor guard passed for this message. A trash, spam or move_to is refused without it." }
  destinations:
    type: array
    default: []
    description: "The heo accounts a message may be moved to: {account, channel, inbox, email}."
    items: { type: object }
  ops:
    type: array
    description: "The script's ordered ops for the message."
    items:
      type: object
      required: [verb, key]
      properties:
        verb:    { type: string, enum: [read, unread, flag, unflag, archive, label, trash, spam, unsubscribe, reply, move_to] }
        label:   { type: string, description: "The label name, for verb label." }
        key:     { type: string, description: "Idempotency key of the op." }
        mode:    { type: string, enum: [draft, send], description: "For verb reply." }
        text:    { type: string, description: "For verb reply: the text the script composed." }
        reply_all: { type: boolean }
        cc:      { type: array, items: { type: string } }
        account: { type: string, description: "For verb move_to: the destination account." }
        mailbox: { type: string, description: "For verb move_to: the label the copy gets there." }
exit_codes: { ok: [0, 3], retry: [6, 70] }    # 70: heo's daemon is not running; 6: transient. 8 (outcome unknown) is neither: the step fails
outputs:
  from: file:out.json
  format: json
  schema:
    type: object
    required: [provider_id, status, results]
    properties:
      n: { type: [integer, 'null'] }
      provider_id: { type: string }
      status: { type: string, enum: [ok, failed, held, outcome_unknown] }
      note: { type: string, description: "The informational outcome (unsubscribe)." }
      reason: { type: string, description: "Why the item is held." }
      results:
        type: array
        items:
          type: object
          required: [verb, key, status]
          properties:
            verb: { type: string }
            key: { type: string }
            status: { type: string, enum: [ok, failed, skipped, outcome_unknown, held, noted] }
            operation: { type: [string, 'null'] }
            replayed: { type: boolean }
            error: { type: [string, 'null'] }
side_effect: irreversible
approval: required
idempotent: true                # the same keys replay: nothing goes out twice
privacy: local
capabilities: [mail.write, mail.send]
timeout: 900s
retry: { max_attempts: 3, backoff: 5s }

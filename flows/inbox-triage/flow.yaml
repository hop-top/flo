flow: inbox-triage
version: 0.5.0
description: Classify new mail, ask about what needs a person, apply the rest.
on:
  - schedule: { rrule: "FREQ=MINUTELY;INTERVAL=15" }
  - manual: {}
run_as: automation
# Mail is private: nothing in this flow may reach a cloud service. The judgment
# runs on this machine's model; the list below names Jev after it, and under
# this ceiling the engine skips it.
#
# Opt in to Jev (a hosted model, TypeSafe through OpenRouter) only by deciding
# that the headers of your mail may leave the machine (sender, subject, date,
# flags, folder, history; never a body): set `privacy: cloud-allowed` here and
# on `label` and `weigh`, and keep the openrouter_api_key secret on the profile.
# With `engine: auto` Jev then answers only when the local model is not
# detected; without the key it fails (secret_not_found), it never falls back to
# a silent skip. Compare the two on a day of mail first (docs: flows/inbox-triage).
privacy: local-only
tasks: per-run
concurrency: { on_overlap: skip }
vars:
  # The labels a message may be filed under (the script's SOP labels). A label
  # that does not exist in an account makes the plan item invalid; the only
  # label the script creates is `security` (see security_label).
  labels:
    type: list
    default:
      - Action Required
      - Waiting
      - Finance
      - Legal
      - Customers
      - Sales
      - Marketing
      - Operations
      - Vendors
      - People
      - Projects
      - Travel
      - Subscriptions
      - Reference
  # The accounts selected for the run, by the script's names; none is every
  # configured account (and every one in heo_accounts).
  accounts:
    type: list
    default: []
  # Accounts whose inbox is listed through heo (read only) instead of the
  # script's own backend, as {account, inbox, email}: `account` is the script's
  # name for it, `inbox` the heo inbox id (default: the account name), `email`
  # the account's own address (To of its messages; default: left out), and
  # optionally `channel`, the heo channel key (default: the account name).
  # Empty:
  # every account is fetched by the script, as before. A listed account must
  # also be in `accounts` when that is set.
  heo_accounts:
    type: list
    default: []
steps:
  # One run per cycle, whatever the backends. Each heo account is listed by
  # heo (a step per element, none when heo_accounts is empty); the script then
  # snapshots the listings and fetches every other selected account through its
  # own backend (direct IMAP, himalaya, heo backend) into the same run, so the
  # steps below see one run. No lanes: fetch only reads and snapshots. The
  # script's own state (seen mail, pending locks, trust) lives between the
  # steps, so they are ordered with depends_on; the run id is the data they
  # share.
  - id: heo-list
    uses: heo/inbox.list@1
    for_each: "{{ vars.heo_accounts }}"
    with:
      account: "{{ item.account }}"
      inbox: "{{ has(item.inbox) ? item.inbox : '' }}"
      email: "{{ has(item.email) ? item.email : '' }}"

  - id: fetch
    uses: inbox/ingest@1
    with:
      listings: "{{ results['heo-list'] }}"
      accounts: "{{ vars.accounts }}"

  # The judgment: two questions per message over its headers (the snapshot
  # holds no body), asked of flo/ai.classify@1. `rows` lists the messages that
  # still need a decision; `label` files each one under a label, `weigh` says
  # how much it matters; `decisions` turns both into the script's decisions
  # file by the script's own policy (low confidence is Needs Review, an
  # abstention stays in the inbox for a person, quiet mail is also read and
  # archived, mail from a person is never filed away, by the script's own
  # contacts, mutes and ruled-out senders from `senders`). The classifier backend
  # is configuration (ai.classifier=judge / FLO_AI_CLASSIFIER=judge); the engine
  # defaults to auto (ai.judge.engine). The model is the local Qwen3 4B
  # Instruct; Jev is listed after it and skipped under the local-only ceiling
  # above. The model must pass ai.models.allow / ai.models.deny
  # (e.g. FLO_AI_MODELS_ALLOW=ollama://qwen3*).
  # Heo accounts hold no authentication results in heo's own record: the
  # script has them only as headers rows. The messages that need them (the
  # script's own rule: signup/receipt mail, customer-vendor senders,
  # authentication-class mail) are asked of the script, their raw headers read
  # through heo (read only, headers kept, nothing else of the message) and
  # handed back for the script to store, before `senders` reads the facts.
  # Skipped with heo_accounts empty.
  - id: auth-need
    uses: inbox/authfacts@1
    when: "{{ size(vars.heo_accounts) > 0 }}"
    depends_on: [fetch]
    with:
      accounts: "{{ vars.heo_accounts.map(a, a.account) }}"

  - id: auth-raw
    uses: heo/message.raw@1
    when: "{{ size(vars.heo_accounts) > 0 && size(results['auth-need'].candidates) > 0 }}"
    with:
      candidates: "{{ results['auth-need'].candidates }}"

  - id: auth-fill
    uses: inbox/authfacts@1
    when: "{{ size(vars.heo_accounts) > 0 && size(results['auth-need'].candidates) > 0 }}"
    with:
      accounts: "{{ vars.heo_accounts.map(a, a.account) }}"
      raw: "{{ results['auth-raw'] }}"

  - id: rows
    uses: inbox/rows@1
    depends_on: [fetch]
    with: { run_dir: "{{ results.fetch.run_dir }}" }

  # What the script knows about each sender (contact, mute, ruled out, person):
  # headers and addresses from its local store, no model. The guard "mail from
  # a person is never filed away" is read from these facts.
  - id: senders
    uses: inbox/senders@1
    depends_on: [fetch, auth-fill]
    with: { run: "{{ results.fetch.run }}" }

  - id: label
    uses: flo/ai.classify@1
    privacy: local-only          # headers stay on the machine; refuses a cloud model
    with:
      model: [ollama://qwen3:4b-instruct-2507-q4_K_M, jev]
      engine: auto
      labels: "{{ vars.labels }}"
      abstain: true
      instructions: >-
        Best label for filing this mail in the owner's mailbox? Abstain when
        routine filing (a label, read and archive flags) does not clearly cover
        the message: legal, conflict, negotiation, angry or personal mail,
        anything the headers alone do not settle.
      items: "{{ results.rows.items }}"

  - id: weigh
    uses: flo/ai.classify@1
    privacy: local-only
    with:
      model: [ollama://qwen3:4b-instruct-2507-q4_K_M, jev]
      engine: auto
      labels: [irrelevant, low, normal, high, critical]
      instructions: >-
        How much does this mail matter to the owner? irrelevant: billing noise,
        marketing, sign-in links, security pings. low: receipts and routine
        notices. normal: ongoing service mail, digests worth keeping. high:
        affects work in flight, a client, or money. critical: drop everything.
      items: "{{ results.rows.items }}"

  - id: decisions
    uses: inbox/decisions@1
    with:
      run_dir: "{{ results.fetch.run_dir }}"
      labels: "{{ results.label.items }}"
      weights: "{{ results.weigh.items }}"
      sop_labels: "{{ vars.labels }}"
      senders: "{{ results.senders.rows }}"
      # Label for unrequested auth mail (login code, reset, magic link) from an
      # authenticated customer vendor, which is then archived. The script
      # creates `security` at apply when an account lacks it; any other name
      # must already exist. Null keeps every auth mail in the inbox, flagged.
      security_label: security
      engine: "{{ has(results.label.engine) ? results.label.engine : '' }}"
      model: "{{ has(results.label.model) ? results.label.model : '' }}"

  # Heo accounts are planned from facts read now (provider labels, what the
  # channel can do, the messages in the inbox), so the script's plan makes no
  # mailbox call for them and its stale check sees the inbox as it is, not as
  # it was at fetch time. An account with no facts (heo failed) is planned
  # invalid, never automatic. None with heo_accounts empty: the script reads
  # its own mailboxes, as before.
  - id: heo-facts
    uses: heo/plan-facts@1
    for_each: "{{ vars.heo_accounts }}"
    depends_on: [decisions]
    with:
      account: "{{ item.account }}"
      channel: "{{ has(item.channel) ? item.channel : '' }}"
      inbox: "{{ has(item.inbox) ? item.inbox : '' }}"
      email: "{{ has(item.email) ? item.email : '' }}"

  - id: plan
    uses: inbox/plan@1
    depends_on: [decisions, heo-facts]
    with:
      run: "{{ results.fetch.run }}"
      facts: "{{ results['heo-facts'] }}"

  # Everything apply would touch goes through the approval, so the guard of the
  # irreversible step always finds a decision: the script's automatic items
  # (every action at a trusted level) are decided by trust and cost no one a
  # look; only the pending ones park the run. Nothing to do skips both.
  - id: approve
    uses: flo/approval@1
    when: "{{ size(results.plan.pending) + size(results.plan.auto) > 0 }}"
    with:
      title: Triage the inbox
      items: "{{ results.plan.pending + results.plan.auto }}"
      verdicts: [approve, reject]
      trust: inbox
      surface: tlc
      context: { run: "{{ results.fetch.run }}", run_dir: "{{ results.plan.run_dir }}" }

  # The accounts listed in heo_accounts are applied through heo, the others by
  # the script as before (`apply` below leaves the heo accounts to these steps).
  # The script says what to do and commits what was done; heo's nodes do it
  # between the two: `ops` asks the script for the operations of every approved
  # or automatic item of those accounts (it re-checks the guards, and refuses a
  # delete it has no sender facts for), `ensure` creates the label `security`
  # where the plan needs it (the only label ever created), `act` runs each
  # message's ops through heo, that message only, waiting for heo to settle each
  # one, and `record` commits the outcome. Only the low-blast ops (read, unread,
  # flag, unflag, archive, label) go to heo for now: an item with a trash, spam,
  # unsubscribe, reply or cross-account move in it is held, left pending with
  # the reason in the receipt, not applied by anything. A failed op is data (the
  # item is marked failed); an outcome heo cannot confirm fails the step and
  # parks the run for a person. None of these steps exists with heo_accounts
  # empty: `apply` is then the one step, as before.
  - id: ops
    uses: inbox/ops@1
    when: "{{ size(vars.heo_accounts) > 0 && size(results.approve.approved) + size(results.approve.auto) > 0 }}"
    depends_on: [plan, approve]
    with:
      run: "{{ results.fetch.run }}"
      accounts: "{{ vars.heo_accounts.map(a, a.account) }}"

  - id: ensure
    uses: heo/provider-label.ensure@1
    for_each: "{{ results.ops.labels_needed }}"
    concurrency: 1
    with:
      run: "{{ results.fetch.run }}"
      account: "{{ item.account }}"
      channel: "{{ vars.heo_accounts.filter(a, a.account == item.account).map(a, has(a.channel) ? a.channel : '')[0] }}"
      label: "{{ item.label }}"

  - id: act
    uses: heo/conversation.act@1
    for_each: >-
      {{ results.ops.items.filter(i, i.blast == 'low' && size(i.ops) > 0 &&
           i.ops.all(o, !has(o.ensure) || !o.ensure || results.ensure.exists(e, e.account == i.account && e.status == 'ok'))) }}
    depends_on: [ops, ensure]
    concurrency: 1
    with:
      n: "{{ item.n }}"
      account: "{{ item.account }}"
      channel: "{{ vars.heo_accounts.filter(a, a.account == item.account).map(a, has(a.channel) ? a.channel : '')[0] }}"
      provider_id: "{{ item.id }}"
      ops: "{{ item.ops }}"

  - id: record
    uses: inbox/record@1
    when: "{{ size(results.ops.items) > 0 || size(results.ops.refused) > 0 }}"
    depends_on: [ops, ensure, act]
    with:
      run: "{{ results.fetch.run }}"
      ops: "{{ results.ops }}"
      acts: "{{ has(results.act) ? results.act : [] }}"
      ensures: "{{ has(results.ensure) ? results.ensure : [] }}"

  # Runs only when something was approved or automatic: a run whose pending
  # items were all rejected applies nothing.
  - id: apply
    uses: inbox/apply@1
    when: "{{ size(results.approve.approved) + size(results.approve.auto) > 0 }}"
    depends_on: [plan, approve, record]
    with:
      run: "{{ results.fetch.run }}"
      exclude_accounts: "{{ vars.heo_accounts.map(a, a.account) }}"
